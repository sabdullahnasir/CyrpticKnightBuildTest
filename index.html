<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | WebGL 2d</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">WebGL 2d</div>
      </div>
    </div>

    <button id="reloadUnity" style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
      Reload Game
    </button>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var unityInstanceGlobal = null;

      // Show warnings/errors banner (unchanged)
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/cryptic knight build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/cryptic knight build.data",
        frameworkUrl: buildUrl + "/cryptic knight build.framework.js",
        codeUrl: buildUrl + "/cryptic knight build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebGL 2d",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // config.devicePixelRatio = 1; // Uncomment to lower resolution on mobile
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      // Function to create Unity instance
      function createUnity() {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        })
          .then((unityInstance) => {
            unityInstanceGlobal = unityInstance;
            document.querySelector("#unity-loading-bar").style.display = "none";

            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
              navigator.userAgent
            );
            const deviceType = isMobile ? "Mobile" : "Pc";

            unityInstanceGlobal.SendMessage("DeviceDetector", "ReceiveDeviceType", deviceType);

            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          })
          .catch((message) => {
            alert(message);
          });
      }

      // Function to load Unity instance, unloading previous if any
      function loadUnity() {
        if (unityInstanceGlobal !== null) {
          unityInstanceGlobal.Quit().then(() => {
            unityInstanceGlobal = null;
            createUnity();
          });
        } else {
          createUnity();
        }
      }

      // Load Unity initially
      loadUnity();

      // Hook up reload button to safely reload Unity instance
      document.getElementById("reloadUnity").onclick = () => {
        document.querySelector("#unity-loading-bar").style.display = "block";
        loadUnity();
      };

      // Load Unity loader script dynamically
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        // Unity instance creation handled by loadUnity()
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
