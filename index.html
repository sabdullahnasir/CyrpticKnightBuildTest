<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | WebGL 2d</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
 #rotate-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.85);
    color: white;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5vw; /* responsive padding */
    box-sizing: border-box;
  }

  #rotate-screen .message {
    font-size: 6vw; /* responsive text size */
    max-width: 90vw; /* prevent overflow */
    line-height: 1.4;
  }

  /* Optional: smooth font scaling for smaller devices */
  @media (min-width: 768px) {
    #rotate-screen .message {
      font-size: 3vw;
    }
  }

  @media (min-width: 1200px) {
    #rotate-screen .message {
      font-size: 2vw;
    }
  }
</style>

  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">WebGL 2d</div>
      </div>
      
      <div id="rotate-screen" style="display: none;">
        <div class="message">please rotate your device to landscape</div>
      </div>

    </div>
    <script>
     var canvas = document.querySelector("#unity-canvas");
var unityInstanceGlobal = null; // Global Unity instance reference

var buildUrl = "Build";
var loaderUrl = buildUrl + "/cryptic knight build.loader.js";

var config = {
  arguments: [],
  dataUrl: buildUrl + "/cryptic knight build.data",
  frameworkUrl: buildUrl + "/cryptic knight build.framework.js",
  codeUrl: buildUrl + "/cryptic knight build.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "WebGL 2d",
  productVersion: "1.0",
  showBanner: unityShowBanner,
};

// Show loading bar initially
document.querySelector("#unity-loading-bar").style.display = "block";

// Function to create Unity instance
function instantiateUnity() {
  createUnityInstance(canvas, config, (progress) => {
    document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
  }).then((unityInstance) => {
    unityInstanceGlobal = unityInstance;
    document.querySelector("#unity-loading-bar").style.display = "none";

    const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const deviceType = isMobile ? "Mobile" : "Pc";

    unityInstanceGlobal.SendMessage("DeviceDetector", "ReceiveDeviceType", deviceType);

    document.querySelector("#unity-fullscreen-button").onclick = () => {
      unityInstanceGlobal.SetFullscreen(1);
    };

  }).catch((message) => {
    alert(message);
  });
}

// Function to quit old instance and create new one
function createOrRestartUnity() {
  if (unityInstanceGlobal !== null) {
    unityInstanceGlobal.Quit().then(() => {
      unityInstanceGlobal = null;
      instantiateUnity();
    }).catch((error) => {
      console.warn("Error quitting Unity instance:", error);
      instantiateUnity(); // Try to instantiate anyway
    });
  } else {
    instantiateUnity();
  }
}

// Load loader script and instantiate Unity instance safely
var script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createOrRestartUnity();
};
document.body.appendChild(script);

// Check orientation function and listeners (unchanged)
function CheckOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const overlay = document.getElementById("rotate-screen");
  if (isPortrait && isMobile) overlay.style.display = 'flex';
  else overlay.style.display = 'none';
}
window.addEventListener('load', CheckOrientation);
window.addEventListener('resize', CheckOrientation);
window.addEventListener('orientationchange', CheckOrientation);

// unityShowBanner function remains unchanged
function unityShowBanner(msg, type) {
  var warningBanner = document.querySelector("#unity-warning");
  function updateBannerVisibility() {
    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
  }
  var div = document.createElement('div');
  div.innerHTML = msg;
  warningBanner.appendChild(div);
  if (type == 'error') div.style = 'background: red; padding: 10px;';
  else {
    if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
    setTimeout(function () {
      warningBanner.removeChild(div);
      updateBannerVisibility();
    }, 5000);
  }
  updateBannerVisibility();
}
    </script>
  </body>
</html>
